<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: Mobile First</title>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f3f4f6;
        }

        .container {
            display: grid;
            gap: 12px;
            padding: 10px;
            min-height: 100vh;

            grid-template-columns: 1fr;
            grid-template-areas:
                "header"
                "nav"
                "main"
                "sidebar"
                "ads"
                "footer";
        }

        .container>div {
            padding: 20px;
            border-radius: 8px;
            color: #fff;
            background: #0891b2;
        }

        .header {
            grid-area: header;
        }

        .nav {
            grid-area: nav;
        }

        .main {
            grid-area: main;
            min-height: 200px;
        }

        .sidebar {
            grid-area: sidebar;
        }

        .ads {
            grid-area: ads;
        }

        .footer {
            grid-area: footer;
        }

        @media (min-width: 640px) {
            .container {
                grid-template-columns: 1fr 1fr;
                grid-template-areas:
                    "header  header"
                    "nav     nav"
                    "main    main"
                    "sidebar ads"
                    "footer  footer";
            }
        }

        @media (min-width: 1024px) {
            .container {
                grid-template-columns: 200px 1fr 250px;
                grid-template-rows: auto 1fr auto auto;
                grid-template-areas:
                    "header header  header"
                    "nav    main    sidebar"
                    "nav    main    ads"
                    "footer footer  footer";
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">header</div>
        <div class="nav">nav</div>
        <div class="main">main</div>
        <div class="sidebar">sidebar</div>
        <div class="ads">ads</div>
        <div class="footer">footer</div>
    </div>

</body>

</html>
